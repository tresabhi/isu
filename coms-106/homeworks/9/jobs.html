<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaJam Coffee Bar Jobs</title>
    <link rel="stylesheet" href="javajam.css" />
  </head>
  <body>
    <div id="wrapper">
      <header>
        <h1><a href="index.html">JavaJam Coffee Bar</a></h1>
      </header>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="music.html">Music</a></li>
          <li><a href="jobs.html">Jobs</a></li>
        </ul>
      </nav>

      <main>
        <div id="herojobs"></div>

        <h2>Jobs at JavaJam</h2>

        <p>
          Want to work at JavaJam? Fill out the form below to start your
          application. All information is required.
        </p>

        <form
          method="post"
          action="https://webdevbasics.net/scripts/javajam8.php"
        >
          <label for="myName">Name:</label>
          <input type="text" name="myName" id="myName" required />

          <label for="myEmail">E-mail:</label>
          <input type="email" name="myEmail" id="myEmail" required />

          <label for="myStart">Start Date:</label>
          <input type="date" name="myStart" id="myStart" required />

          <label for="myExperience">Experience:</label>
          <textarea
            name="myExperience"
            id="myExperience"
            rows="2"
            cols="20"
            required
          ></textarea>

          <input type="submit" id="mySubmit" value="Apply Now" />
        </form>
      </main>

      <footer>Copyright &copy; 2020 JavaJam Coffee Bar</footer>
    </div>
  </body>
</html>
